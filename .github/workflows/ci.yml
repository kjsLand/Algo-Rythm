name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install the JUCE system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev

      # Keep the downloads and their stamps. FetchContent downloads again without the stamps.
      - name: Cache the FetchContent download folder
        uses: actions/cache@v6.1.0
        with:
          path: |
            .fetchcontent
            !.fetchcontent/*-build
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DFETCHCONTENT_BASE_DIR:PATH=.fetchcontent

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        env:
          ALGO_PROP_SEEDS: 10000
        run: ctest --test-dir build -C Release --output-on-failure

  format:
    name: Check the code format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install clang-format
        run: pipx install clang-format==21.1.8

      - name: Run clang-format
        run: git ls-files -z '*.cpp' '*.h' | xargs -0 clang-format --dry-run --Werror
